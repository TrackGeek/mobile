name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v7
        with:
          distribution: temurin
          java-version: 27
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=TRACKGEEK_API_URL=${{ vars.TRACKGEEK_API_URL || 'https://api.trackgeek.net' }} --dart-define=TRACKGEEK_GOOGLE_CLIENT_ID=${{ vars.TRACKGEEK_GOOGLE_CLIENT_ID }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk trackgeek-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: trackgeek-${{ github.ref_name }}.apk
          generate_release_notes: true
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: apk
          path: trackgeek-*.apk
